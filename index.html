<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1E3D">
<title>AU·Registro — Armando Uban</title>
<style>
:root{
  --navy:#0F1E3D; --navy2:#1B2E57; --gold:#C9A227; --gold2:#E3C567; --goldT:#F6EED3;
  --bg:#F4F5F8; --card:#FFFFFF; --ink:#121826; --soft:#5B6478; --line:#DDE1EA;
  --ok:#2E7D4F; --no:#B3412E;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:90px}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}

header{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 0;border-bottom:3px solid var(--gold)}
.hd{max-width:760px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px}
.eyebrow{flex:1;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);font-weight:700}
.langs{display:flex;background:rgba(255,255,255,.1);border-radius:20px;padding:3px}
.langs button{border:0;background:transparent;color:#C7D0E2;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700}
.langs button.on{background:var(--gold);color:var(--navy)}
.pill{border:0;border-radius:20px;padding:5px 10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.12);color:#fff;white-space:nowrap}
.pill.ok{background:#1F5A3A} .pill.pend{background:#6E5608} .pill.off{background:#4A5470} .pill.err{background:#7A2B1F}
.catrow{display:flex;align-items:center;gap:8px;margin:8px 0 2px}
.catsel{flex:1;min-width:0;background:transparent;border:0;color:#fff;font-size:22px;font-weight:800;padding:2px 0;appearance:none;-webkit-appearance:none;text-overflow:ellipsis}
.catsel option{color:var(--ink)}
.caret{color:var(--gold2);font-size:14px;pointer-events:none;margin-left:-26px}
.sub{font-size:12.5px;color:#C7D0E2;margin:0 0 10px}
nav{display:flex;gap:2px;max-width:760px;margin:0 auto}
nav button{flex:1;background:transparent;border:0;color:#C7D0E2;padding:10px 4px 11px;font-weight:600;font-size:14px;border-bottom:3px solid transparent;margin-bottom:-3px}
nav button.on{color:#fff;border-bottom-color:var(--gold2)}

main{max-width:760px;margin:0 auto;padding:14px 12px}
.banner{background:var(--goldT);border:1px solid var(--gold);color:#5A4708;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.banner .btn{margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,30,61,.05)}
h2{font-size:17px;margin:0 0 10px;color:var(--navy)}
h3{font-size:15px;margin:0}
.muted{color:var(--soft);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:600}
label.f input,label.f select,label.f textarea,.inp{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;font-size:15px;text-transform:none;letter-spacing:0;font-weight:400;width:100%}
label.f textarea{min-height:110px;font-size:14px}
.seg{display:flex;background:#EEF0F5;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px 4px;font-weight:600;font-size:13.5px;color:var(--soft)}
.seg button.on{background:var(--navy);color:#fff}
.seg.att button.on[data-v="P"]{background:var(--ok)}
.seg.att button.on[data-v="A"]{background:var(--no)}

.kid{padding:0;overflow:hidden}
.kid-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.av{width:38px;height:38px;border-radius:50%;background:var(--navy2);color:var(--gold2);display:grid;place-items:center;font-weight:700;flex-shrink:0;font-size:14px}
.kid-h .nm{flex:1;min-width:0}
.kid-h .nm b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kid-h .seg{width:168px;flex-shrink:0}
.kid.abs .kid-b{display:none}
.kid.abs{opacity:.75}
.kid-b{padding:6px 14px 12px}
.ind{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.ind:last-of-type{border-bottom:0}
.ind .il{flex:1;min-width:0}
.ind .il b{font-size:14px;display:block}
.ind .il i{font-style:normal;font-size:12px;color:var(--soft);display:block}
.ind .il .cue{font-size:11.5px;color:#8A6D0F;font-weight:600}
.lv{display:flex;gap:4px;flex-shrink:0}
.lv button{width:42px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;line-height:1;opacity:.55;filter:grayscale(.6)}
.lv.n5 button{width:34px;font-size:15px;font-weight:800;color:var(--soft)}
.lv button.on{opacity:1;filter:none;border-width:2px;color:var(--ink)}
.cnts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
@media (max-width:420px){ .cnt button{width:28px;height:30px} .cnt .ctl{gap:2px} .cnt span{font-size:10.5px} }
.cnt{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:6px}
.cnt span{font-size:11.5px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.04em;text-align:center}
.cnt .ctl{display:flex;align-items:center;gap:5px}
.cnt button{width:32px;height:32px;border-radius:8px;border:0;background:var(--navy);color:#fff;font-size:17px;font-weight:700}
.cnt button.m{background:#E3E7EF;color:var(--navy)}
.cnt output{min-width:22px;text-align:center;font-weight:700;font-size:16px}
.tval{display:flex;gap:8px;align-items:center;margin-top:6px}
.tval input{max-width:140px;font-size:18px;font-weight:700}
.note{margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--soft)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}

.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-weight:600;font-size:14px;color:var(--navy)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.dng{color:var(--no)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sticky{position:fixed;left:0;right:0;bottom:0;background:rgba(244,245,248,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:5}
.sticky .in{max-width:760px;margin:0 auto;display:flex;gap:8px}
.sticky .btn.pri{flex:1;padding:13px}

.reg{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.reg:last-child{border-bottom:0}
.tag{font-size:10px;font-weight:800;padding:3px 6px;border-radius:6px;letter-spacing:.04em;flex-shrink:0}
.tag.E{background:#E6EEF8;color:var(--navy2)} .tag.P{background:var(--goldT);color:#6E5608} .tag.T{background:#E3F2E9;color:#1F5A3A}
.reg .t{flex:1;min-width:0;font-size:14px}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 3px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);font-weight:700}
td:first-child,th:first-child{text-align:left}
.dot{display:inline-block;width:26px;height:24px;border-radius:12px;line-height:24px;font-size:10.5px;font-weight:700;color:#fff}
.d0{background:#E8EBF1;color:var(--soft)}
.pdfmini{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 6px;font-size:11px;font-weight:700;color:var(--navy)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font-weight:600;font-size:14px;color:var(--soft)}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;margin-bottom:12px}
.kpi{background:var(--navy);color:#fff;border-radius:12px;padding:9px 4px;text-align:center}
.kpi b{display:block;font-size:19px;color:var(--gold2);line-height:1.1}
.kpi span{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:#C7D0E2}
.spark{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.spark:last-child{border-bottom:0}
.spark .sl{width:118px;flex-shrink:0;font-size:13px;font-weight:600}
.spark svg{flex:1;height:56px}
.obs li{margin-bottom:6px;font-size:14px}
.obs li span{color:var(--soft);font-size:12px}
#bitList{max-height:460px;overflow:auto}
.tclk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tclk .clock{font-size:38px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;min-width:110px;line-height:1}
.tclk .dur{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--soft);font-weight:700}
.tclk .dur input{width:58px;padding:6px;border:1px solid var(--line);border-radius:8px}
.tchips{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin-bottom:10px}
.tchip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;min-width:0}
.tchip b{font-size:20px;line-height:1.1;color:var(--navy)}
.tchip span{font-size:12px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tchip.on{background:var(--navy);border-color:var(--navy)} .tchip.on b{color:var(--gold2)} .tchip.on span{color:#fff}
.tacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}
.tact{border:1px solid var(--line);background:#F7F8FB;border-radius:10px;padding:10px 8px;min-height:50px;font-weight:700;font-size:13px;text-align:left;display:flex;justify-content:space-between;gap:4px;align-items:flex-start;color:var(--ink)}
.tact.g{background:#E8F4EC;border-color:#BFDCC9} .tact.b{background:#FBEAE6;border-color:#EBC4BA}
.tact i{font-style:normal;opacity:.65;font-size:15px}
.tact:active{transform:scale(.97)}
.tacts.off .tact{opacity:.45}
.tsum{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:6px 0 10px}
.tsum div{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.tsum b{display:block;font-size:20px;color:var(--navy)} .tsum span{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:700}
.tfeed{list-style:none;margin:0;padding:0}
.tfeed li{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.tfeed li:last-child{border-bottom:0}
.sheet{position:fixed;inset:0;background:rgba(15,30,61,.6);z-index:25;overflow:auto;padding:10px 10px calc(20px + env(safe-area-inset-bottom))}
.sheet-in{max-width:760px;margin:0 auto;background:var(--bg);border-radius:16px;padding:14px;border-top:4px solid var(--gold)}
.sheet-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}.sheet-h h2{flex:1;margin:0}
.fscore{background:var(--navy);color:#fff;border-radius:12px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fscore b{font-size:26px;color:var(--gold2)} .fscore span{font-size:13px;color:#C7D0E2}
.lvrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.lvrow:last-child{border-bottom:0}
.lvpill{border-radius:20px;padding:3px 10px;font-size:12.5px;font-weight:700;color:#fff}
.chips button.abs{opacity:.55;text-decoration:line-through}
.lvpill.no{background:#E8EBF1;color:var(--soft)}
.tfeed .m{font-weight:800;color:var(--soft);width:34px;font-variant-numeric:tabular-nums}
.bit{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink)}
.bit:last-child{border-bottom:0}
.bit small{display:block;color:var(--soft);font-size:11.5px}
.ro{display:inline-block;background:var(--goldT);color:#6E5608;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700;margin-left:6px}
.tip{font-size:12px;color:var(--soft);margin-top:8px}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ph .nm{flex:1;min-width:0}

.pcard{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.pgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.pgrid.c4{grid-template-columns:62px 1fr 1fr 1fr}
.plh{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--soft);font-weight:700;display:block;margin-bottom:2px}
.prow{display:flex;gap:6px}
.prow .x{width:40px;flex-shrink:0;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--no);font-weight:700}

/* login */
#login{position:fixed;inset:0;background:var(--navy);z-index:20;overflow:auto;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{background:#fff;border-radius:18px;max-width:380px;width:100%;padding:22px;border-top:5px solid var(--gold)}
#login h1{margin:4px 0 2px;font-size:26px;color:var(--navy)}
#login .eyebrow{color:#8A6D0F}
#login .msg{font-size:13.5px;margin-top:10px;min-height:18px}
#login .msg.err{color:var(--no)} #login .msg.ok{color:var(--ok)}
#login .lrow{display:flex;justify-content:space-between;align-items:center}
#login .langs{background:#EEF0F5} #login .langs button{color:var(--soft)}

.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--soft)}
code{background:#EEF0F5;border-radius:5px;padding:1px 5px;font-size:12.5px}

@media (max-width:420px){
  .kid-h .seg{width:146px}
  .lv button{width:38px}
  .lv.n5 button{width:30px}
  .spark .sl{width:92px}
}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;padding:0;font-size:12px}
  header{background:#fff;color:var(--navy);border-bottom:2px solid var(--gold);padding:0 0 6px}
  .catsel{color:var(--navy)} .sub{color:var(--soft)} .eyebrow{color:#8A6D0F}
  nav,.langs,.pill,.caret,.sticky,.btn,.pdfmini,.banner,.toast,.noprint{display:none!important}
  .card{box-shadow:none;break-inside:avoid;padding:10px}
  .kpi{background:#fff;color:var(--navy);border:1px solid var(--line)} .kpi b{color:var(--navy)} .kpi span{color:var(--soft)}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" hidden>
  <div class="box">
    <div class="lrow"><div class="eyebrow">Armando Uban · Performance Analyst</div>
      <div class="langs"><button data-lang="es">ES</button><button data-lang="en">EN</button></div></div>
    <h1>AU·Registro</h1>
    <p class="muted" data-t="loginSub" style="margin-top:0"></p>
    <div class="seg" id="lMode" style="margin-bottom:12px">
      <button data-v="in" class="on" data-t="signIn"></button><button data-v="up" data-t="signUp"></button>
    </div>
    <label class="f" style="margin-bottom:10px"><span data-t="email"></span><input type="email" id="lEmail" autocomplete="email"></label>
    <label class="f"><span data-t="password"></span><input type="password" id="lPass" autocomplete="current-password"></label>
    <button class="btn pri" id="lGo" style="width:100%;margin-top:14px;padding:12px"></button>
    <div class="msg" id="lMsg"></div>
    <p class="tip" data-t="loginTip"></p>
    <button class="btn sm" id="lCancel" hidden data-t="cancel"></button>
  </div>
</div>

<header>
  <div class="hd">
    <div class="top">
      <div class="eyebrow">AU·Registro · Armando Uban</div>
      <button class="pill" id="syncPill"></button>
      <div class="langs"><button data-lang="es">ES</button><button data-lang="en">EN</button></div>
    </div>
    <div class="catrow">
      <select class="catsel" id="catSel"></select><span class="caret">▼</span>
    </div>
    <p class="sub" id="catSub"></p>
  </div>
  <nav>
    <button data-tab="reg" class="on" data-t="tabReg"></button>
    <button data-tab="ruta" data-t="tabRuta"></button>
    <button data-tab="plantel" data-t="tabSquad"></button>
    <button data-tab="ajustes" data-t="tabSet"></button>
  </nav>
</header>

<main>
  <div class="banner" id="reloginBanner" hidden><span data-t="relogin"></span><br><button class="btn sm pri" id="bRelogin" data-t="signIn"></button></div>
  <div class="card" id="noCat" hidden>
    <h2 data-t="welcome"></h2>
    <p class="muted" data-t="welcomeTxt" style="margin-top:0"></p>
    <div class="row"><button class="btn pri" data-goto="newcat" data-t="createCat"></button><button class="btn" id="bSample0" data-t="loadSample"></button></div>
    <p class="tip" data-t="welcomeParent"></p><button class="btn sm" id="bRefresh0" data-t="syncNow"></button>
  </div>

  <!-- REGISTRAR -->
  <section id="v-reg">
    <div class="card">
      <h2 id="regTitle"></h2>
      <div class="grid2">
        <label class="f"><span data-t="fecha"></span><input type="date" id="fFecha"></label>
        <label class="f"><span data-t="semana"></span><select id="fSemana"></select></label>
        <div class="full"><div class="seg" id="fTipo">
          <button data-v="E" data-t="tipoE"></button><button data-v="P" data-t="tipoP"></button><button data-v="T" data-t="tipoT"></button>
        </div></div>
        <label class="f full" data-show="P"><span data-t="rival"></span><input type="text" id="fRival" data-tph="rivalPh"></label>
        <label class="f" data-show="P"><span data-t="gf"></span><input type="number" min="0" id="fGF" inputmode="numeric"></label>
        <label class="f" data-show="P"><span data-t="gc"></span><input type="number" min="0" id="fGC" inputmode="numeric"></label>
        <label class="f full" data-show="T"><span data-t="testName"></span><input type="text" id="fTest" list="testList" data-tph="testPh"></label>
        <label class="f" data-show="T"><span data-t="testUnit"></span><input type="text" id="fUnit" list="unitList" data-tph="unitPh"></label>
        <div class="f" data-show="T" style="display:flex;flex-direction:column;gap:4px"><span class="plh" data-t="testBest"></span>
          <div class="seg" id="fMejor"><button data-v="mayor" data-t="bestHigh"></button><button data-v="menor" data-t="bestLow"></button></div></div>
        <label class="f full" data-show="EP"><span data-t="tema"></span><input type="text" id="fTema" data-tph="temaPh"></label>
      </div>
      <datalist id="testList"></datalist>
      <datalist id="unitList"><option value="s"><option value="m"><option value="cm"><option value="reps"><option value="pts"><option value="km/h"></datalist>
    </div>
    <div class="card" id="tagCard" data-show="P">
      <div class="row" style="justify-content:space-between;margin-bottom:4px"><h2 style="margin:0" data-t="tagTitle"></h2><button class="btn sm" id="bTagToggle"></button></div>
      <p class="tip" style="margin-top:0" data-t="tagSub"></p>
      <div id="tagBody"></div>
    </div>
    <div class="card noprint" id="legendCard">
      <div class="legend" id="legend"></div>
      <div class="tip" data-th="tip"></div>
    </div>
    <div id="kids"></div>
    <div class="card">
      <h2 data-t="saved"></h2>
      <div id="regList"></div>
    </div>
  </section>

  <!-- RUTA -->
  <section id="v-ruta" hidden>
    <div class="card" id="teamCard">
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        <h2 style="margin:0" data-t="group"></h2>

/* ============================================================
   SUPABASE (REST directo, sin librerías)
   ============================================================ */
async function authCall(path, body){
  const r=await fetch(CONFIG.supabaseUrl+"/auth/v1/"+path,{method:"POST",headers:{apikey:CONFIG.supabaseKey,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ const e=new Error(j.msg||j.error_description||j.message||r.status); e.status=r.status; e.code=j.error_code||j.code; throw e; }
  return j;
}
function setSession(j){
  ST.session={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),user:{id:j.user?.id,email:j.user?.email},needsLogin:false};
  persist();
}
async function refreshSession(){
  if(!ST.session?.refresh_token) return false;
  try{ const j=await authCall("token?grant_type=refresh_token",{refresh_token:ST.session.refresh_token}); setSession(j); return true; }
  catch(e){ if(e.status>=400&&e.status<500){ ST.session.needsLogin=true; persist(); renderBanner(); } return false; }
}
async function rest(path, opts={}, retry=true){
  if(ST.session && ST.session.expires_at-60 < Date.now()/1000) await refreshSession();
  const h={apikey:CONFIG.supabaseKey,"Content-Type":"application/json",...(opts.headers||{})};
  if(ST.session?.access_token) h.Authorization="Bearer "+ST.session.access_token;
  const r=await fetch(CONFIG.supabaseUrl+"/rest/v1/"+path,{...opts,headers:h});
  if(r.status===401&&retry){ if(await refreshSession()) return rest(path,opts,false); }
  if(!r.ok){ const j=await r.json().catch(()=>({})); const e=new Error(j.message||("HTTP "+r.status)); e.status=r.status; throw e; }
  const txt=await r.text(); return txt?JSON.parse(txt):null;
}
function pick(tb,row){ const o={}; COLS[tb].forEach(c=>{ let v=row[c]; if(v===undefined||v==="") v=null; o[c]=v; });
  if(tb==="jugadores"&&o.nombre===null) o.nombre="";
  if(tb==="jugadores"&&!Array.isArray(o.padres)) o.padres=[];
  if(o.borrado===null) o.borrado=false;
  if(tb==="actividades"&&!o.registros) o.registros={};
  if(tb==="actividades"&&!Array.isArray(o.eventos)) o.eventos=[];
  if(tb==="categorias"){ o.indicadores=o.indicadores||[]; o.contadores=o.contadores||[]; }
  return o; }

let syncTimer=null;
function scheduleSync(ms=1500){ clearTimeout(syncTimer); syncTimer=setTimeout(sync,ms); }
async function sync(){
  if(syncing||!ST.session||ST.session.needsLogin) { renderPill(); return; }
  if(!navigator.onLine){ renderPill(); return; }
  syncing=true; syncErr=null; renderPill();
  try{
    for(const tb of TABLES){
      const ids=Object.keys(ST.outbox[tb]); if(!ids.length) continue;
      const snap={}; const rows=ids.map(id=>{ const r=ST.data[tb][id]; snap[id]=r?._v; return r?pick(tb,r):null; }).filter(Boolean);
      for(let i=0;i<rows.length;i+=200){
        const out=await rest(`${tb}?on_conflict=id`,{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=representation"},body:JSON.stringify(rows.slice(i,i+200))});
        (out||[]).forEach(r=>{ const loc=ST.data[tb][r.id]; if(loc&&loc._v===snap[r.id]){ delete ST.outbox[tb][r.id]; loc.updated_at=r.updated_at; } });
      }
      ids.forEach(id=>{ if(!ST.data[tb][id]) delete ST.outbox[tb][id]; });
      persist();
    }
    for(const tb of TABLES){
      let since=ST.lastPull[tb]||"1970-01-01T00:00:00Z", more=true;
      while(more){
        const rows=await rest(`${tb}?select=*&updated_at=gt.${encodeURIComponent(since)}&order=updated_at.asc&limit=1000`);
        rows.forEach(r=>{ if(!ST.outbox[tb][r.id]){ r._v=0; ST.data[tb][r.id]=r; } since=r.updated_at; });
        ST.lastPull[tb]=since; more=rows.length===1000;
      }
    }
    while(ST.evq.length){ await rest("rpc/log_evento",{method:"POST",body:JSON.stringify(ST.evq[0])}); ST.evq.shift(); persist(); }
    ST.fam=await rest("rpc/padre_datos",{method:"POST",body:"{}"});
    if(ST.famKid&&!famKid()) ST.famKid=null;
    if(!live("categorias").length&&ST.fam?.jugadores?.length&&!ST.famKid) ST.famKid=ST.fam.jugadores[0].id;
    ST.lastSync=new Date().toISOString();
    if(!cat()){ const c=live("categorias")[0]; ST.cat=c?c.id:null; }
    persist(); renderAll();
  }catch(e){ syncErr=e.message||String(e); console.warn("sync",e); }
  syncing=false; renderPill(); if(curTab==="ajustes") renderSyncInfo();
}

let lMode="in", wipeArmed=false;
function showLogin(cancelable){
  $("#login").hidden=false; $("#lCancel").hidden=!cancelable; $("#lMsg").textContent=""; $("#lMsg").className="msg";
  if(ST.session?.user?.email) $("#lEmail").value=ST.session.user.email;

function renderLoginMode(){ $$("#lMode button").forEach(b=>b.classList.toggle("on",b.dataset.v===lMode)); $("#lGo").textContent=lMode==="in"?t("signIn"):t("signUp"); $("#lPass").autocomplete=lMode==="in"?"current-password":"new-password"; }

$("#lGo").addEventListener("click",async()=>{
  const email=$("#lEmail").value.trim(), pass=$("#lPass").value, msg=$("#lMsg");
  msg.className="msg";
  if(!email||pass.length<6){ msg.textContent=t("needCreds"); msg.classList.add("err"); return; }
  if(!navigator.onLine){ msg.textContent=t("noNet"); msg.classList.add("err"); return; }
  msg.textContent=t("working"); $("#lGo").disabled=true;
  try{
    if(lMode==="up"){
      const back=location.protocol==="https:"?location.origin+location.pathname:CONFIG.appUrl;
      const j=await authCall("signup?redirect_to="+encodeURIComponent(back),{email,password:pass});
      if(!j.access_token){ msg.textContent=t("confirmMail"); msg.classList.add("ok"); lMode="in"; renderLoginMode(); $("#lGo").disabled=false; return; }
      await finishLogin(j);
    } else {
      const j=await authCall("token?grant_type=password",{email,password:pass});
      await finishLogin(j);
    }
  }catch(e){ msg.textContent = e.message==="Failed to fetch" ? t("noNet") : (e.status===400||e.status===401||e.status===422 ? (lMode==="up"?e.message:t("badLogin")) : e.message); msg.classList.add("err"); }
  $("#lGo").disabled=false;
});
async function finishLogin(j){
  const prev=ST.session?.user?.id;
  if(prev && prev!==j.user?.id){
    if(pendingCount() && !wipeArmed){ wipeArmed=true; $("#lMsg").textContent=t("otherUser"); $("#lMsg").className="msg err"; return; }
    const lang=LANG; ST=emptyStore(); LANG=lang;
  }
  wipeArmed=false; setSession(j); $("#login").hidden=true; ST.evq.push({p_accion:"entrar",p_resumen:j.user?.email||null,p_jugador:null}); persist(); renderAll(); sync();
}

function createCategory(nombre, club, etapa){

  putRow("categorias",c); ST.cat=c.id; persist(); return c;

function linesToList(txt, old, isCnt){
  const out=[]; const used=new Set();
  txt.split("\n").map(s=>s.trim()).filter(Boolean).forEach((ln,i)=>{
    const [es,en]=ln.split("|").map(s=>s.trim());
    let prev=old.find(o=>!used.has(o.id)&&(o.es===es||o.en===(en||es))) || (old[i]&&!used.has(old[i].id)&&!txt.includes(old[i].es)?old[i]:null);
    const id=prev?prev.id:(slug(es)||"x")+"-"+Math.random().toString(36).slice(2,5);
    used.add(id);
    const base=prev?{...prev}:{id};
    base.es=es; base.en=en||es;
    if(!prev){ base.s_es=es.slice(0,4); base.s_en=(en||es).slice(0,4); if(isCnt) base.step=1; }
    else if(prev.es!==es||prev.en!==(en||es)){ base.s_es=es.slice(0,4); base.s_en=(en||es).slice(0,4); if(!isCnt){ delete base.a_es; delete base.a_en; } }
    out.push(base);
  });
  return out;
}

/* ---------- ETIQUETADOR AU·Stats ---------- */
const TAG_P=[["pase_ok","g"],["pase_ko","b"],["gol","g"],["rec","g"],["f_com","b"],["f_rec","g"]];
const TAG_E=[["cor_favor","g"],["riv_corner",""],["riv_gol","b"]];
let tagSel=null, tagOpen=true;
const rl=()=>draft.reloj||(draft.reloj={t:0,run:false,since:0});
const clockSecs=()=>{ const c=rl(); return c.t+(c.run?(Date.now()-c.since)/1000:0); };
const fmtClk=x=>{ x=Math.max(0,Math.floor(x)); return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0"); };
const evMin=e=>Math.floor(e.s/60)+1;
function tagCount(pid,a){ return (draft.eventos||[]).filter(e=>e.p===pid&&e.a===a).length; }
function renderTagger(){

  const pt=all("pase_ok")+all("pase_ko"), pp=pt?Math.round(all("pase_ok")/pt*100):null;

  const last=ev.slice(-6).reverse();
  body.innerHTML=`
    <div class="tclk"><span class="clock" id="tagClock">${fmtClk(clockSecs())}</span>

    <div class="tacts ${tagSel?"":"off"}">${TAG_P.map(([a,c])=>`<button class="tact ${c}" data-tg="act" data-a="${a}"><span>${t("tg")[a]}</span><i>${tagSel?(tagCount(tagSel,a)||""):""}</i></button>`).join("")}</div>
    <span class="plh">${t("tagTeam")}</span>
    <div class="tacts">${TAG_E.map(([a,c])=>`<button class="tact ${c}" data-tg="act" data-a="${a}"><span>${t("tg")[a]}</span><i>${team(a)||""}</i></button>`).join("")}</div>
    <div class="tsum">

      <div><b>${all("gol")}–${team("riv_gol")}</b><span>${t("sGol")}</span></div>

    ${last.length?`<ul class="tfeed">${last.map(e=>`<li><span class="m">${evMin(e)}'</span><span>${e.p==="EQ"?"":`<b>${esc(nmOf(e.p))}</b> · `}${t("tg")[e.a]}</span></li>`).join("")}</ul>`:`<p class="muted">${t("tagNone")}</p>`}`;
}
function syncScore(){ $("#fGF").value=draft.goles_favor??""; $("#fGC").value=draft.goles_contra??""; }
function hasGolesCnt(){ return (cat()?.contadores||[]).some(k=>k.id==="goles"); }
function tagAct(a){
  const isTeam=TAG_E.some(x=>x[0]===a), pid=isTeam?"EQ":tagSel;
  if(!pid){ toast(t("tagPick")); return; }
  const e={id:Math.random().toString(36).slice(2,8),s:Math.floor(clockSecs()),p:pid,a};
  (draft.eventos=draft.eventos||[]).push(e);
  if(a==="gol"){ const r=reg(pid); r.cnt=r.cnt||{}; if(hasGolesCnt()) r.cnt.goles=(r.cnt.goles||0)+1; draft.goles_favor=(draft.goles_favor||0)+1; syncScore(); renderKids(); }
  if(a==="riv_gol"){ draft.goles_contra=(draft.goles_contra||0)+1; syncScore(); }
  toast(`${evMin(e)}' · ${pid==="EQ"?"":(players().find(p=>p.id===pid)?.nombre+" · ")}${t("tg")[a]}`);
  if(!isTeam) tagSel=null;
  saveDraft(); renderTagger();
}
function tagUndo(){
  const e=(draft.eventos||[]).pop(); if(!e) return;
  if(e.a==="gol"){ const r=reg(e.p); if(r.cnt?.goles) r.cnt.goles--; if(draft.goles_favor) draft.goles_favor--; syncScore(); renderKids(); }
  if(e.a==="riv_gol"&&draft.goles_contra){ draft.goles_contra--; syncScore(); }
  saveDraft(); renderTagger();
}

}

function drawFicha(doc,a,p){

   CÁLCULOS

const colorFor=v=>{ if(!v) return "#E8EBF1"; const n=niveles(); return n[Math.min(n.length-1,Math.max(0,Math.round(v)-1))].color; };
const levelFor=v=>{ const n=niveles(); return n[Math.min(n.length-1,Math.max(0,Math.round(v)-1))]; };
function weekAvg(pid,indId){
  const out={}, c=cat();
  for(const a of acts()){ if(a.tipo==="T") continue; const r=a.registros?.[pid]; if(!r||r.asis!=="P"||!r.ind?.[indId]) continue;
    (out[a.semana]=out[a.semana]||[]).push(r.ind[indId]); }
  for(const w in out){ out[w]=out[w].reduce((x,y)=>x+y,0)/out[w].length; }
  return out;
}
function recentAvg(pid,indId){ const wa=weekAvg(pid,indId); const ws=Object.keys(wa).map(Number).sort((a,b)=>b-a).slice(0,2); return ws.length?ws.reduce((s,w)=>s+wa[w],0)/ws.length:null; }
function lastWeekVal(pid,indId){ const wa=weekAvg(pid,indId); const ws=Object.keys(wa).map(Number); return ws.length?wa[Math.max(...ws)]:null; }

function sparkSVG(wa){

  const pts=Object.keys(wa).map(Number).sort((a,b)=>a-b);
  for(let i=1;i<pts.length;i++){ const a=pts[i-1],b=pts[i]; g+=`<line x1="${x(a)}" y1="${y(wa[a])}" x2="${x(b)}" y2="${y(wa[b])}" stroke="#1B2E57" stroke-width="2" ${b-a>1?'stroke-dasharray="3 3"':""}/>`; }
  pts.forEach(w=>g+=`<circle cx="${x(w)}" cy="${y(wa[w])}" r="5" fill="${colorFor(wa[w])}" stroke="#fff" stroke-width="1.5"><title>${t("week")} ${w}: ${wa[w].toFixed(1)}</title></circle>`);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${g}</svg>`;
}

function finishPdf(doc){
  const total=doc.pages.length;
  doc.pages.forEach((pg,i)=>{ doc.c=pg; doc.line(40,812,555,812,C.line,0.6);
    wrap(t("pdfFoot1"),7,420).forEach((ln,j)=>doc.text(40,824+j*9,ln,7,{color:C.soft}));

}

async function downloadBlob(blob,name){
  try{ if(window.claude&&window.claude.use){ const dl=await window.claude.use("downloads"); if(dl){ await dl.save({filename:name,data:blob}); if(blob.type==="application/pdf") toast(t("pdfMade")); return; } } }catch(e){ toast(t("dlCancel")); return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  if(blob.type==="application/pdf") toast(t("pdfMade"));
}

const SAMPLE_NOTES=[
 ["Primer día: se quedó junto al papá los primeros 10'. Luego entró al juego.","First day: stayed by his dad for the first 10'. Then joined the game."],
 ["Frena el balón con la suela sin que se lo pidan.","Stops the ball with the sole without being asked."],
 ["Gol tras recuperar el balón y conducir 5 m.","Goal after winning the ball back and dribbling 5 m."],
 ["Ya entra solo a la cancha. Responde a 'Eyes on me!'.","Now walks onto the pitch on his own. Responds to 'Eyes on me!'."],
 ["Se frustra al perder el balón; volvió al juego tras 1'.","Gets frustrated after losing the ball; back in the game after 1'."],
 ["Encara con las dos piernas; cambio de dirección con el exterior.","Takes players on with both feet; changes direction with the outside of the foot."],
 ["2 goles; siempre remata con la derecha.","2 goals; always shoots with his right foot."],
 ["Asistencia a Noah tras conducción por banda.","Assist to Noah after dribbling down the wing."],
 ["Primer remate a arco en juego (antes solo en ejercicio).","First shot on goal in a game (before, only in drills)."]
];
function loadSample(){
  let seed=21; const rnd=()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let x=Math.imul(seed^seed>>>15,1|seed); x=x+Math.imul(x^x>>>7,61|x)^x; return ((x^x>>>14)>>>0)/4294967296; };
  const L=LANG==="es"?0:1;
  const c=createCategory(t("sampleName"),"Four Corners FC","formativo"); c.inicio_ciclo="2026-10-01"; putRow("categorias",c);
  const names=[["Liam",5,"R"],["Emma",6,"R"],["Mateo",4,"L"],["Ava",5,"B"],["Noah",6,"R"],["Lucas",5,""]];
  const ps=names.map(([n,e,pie])=>{ const p={id:uuid(),categoria_id:c.id,nombre:n,edad:e,pie,borrado:false}; putRow("jugadores",p); return p; });
  const base=[[2,2,1,1,2],[2,1,2,2,3],[1,1,1,1,2],[1,2,1,2,2],[2,2,2,1,2],[1,1,1,1,1]];
  const notes={"1-E-5":0,"2-E-2":1,"2-P-1":2,"3-E-5":3,"3-P-0":4,"4-E-3":5,"4-P-4":6,"4-P-3":7,"5-E-2":8};
  const temas=[["Dominio del balón: toques con la suela","Ball mastery: sole touches"],["Conducción y paradas","Dribbling and stops"],["1v1 a mini-arcos","1v1 to mini-goals"],["Cambios de dirección","Changes of direction"],["Conducción + remate","Dribble + shot"]];
  const rivals=["Lakeland Kids","Winter Haven","Bartow Juniors","Lakeland Kids"];
  for(let w=1;w<=5;w++) for(const tipo of ["E","P"]){
    if(w===5&&tipo==="P") continue;
    const regs={};
    ps.forEach((p,pi)=>{
      if((pi===4&&w===2&&tipo==="E")||(pi===2&&w===3)||(pi===5&&w===1&&tipo==="P")){ regs[p.id]={asis:"A"}; return; }
      const ind={}; c.indicadores.forEach((it,i)=>{ if(rnd()<0.18) return; let v=base[pi][i]+(rnd()<(w-1)/7?1:0); if(rnd()<0.1) v--; ind[it.id]=Math.max(1,Math.min(3,v)); });
      const cnt={}; if(tipo==="P"){ const fin=ind.finaliza||base[pi][2]; cnt.remates=Math.floor(rnd()*3)+(fin-1); cnt.goles=Math.min(cnt.remates,Math.floor(rnd()*fin*0.9)); cnt.asistencias=rnd()<0.15?1:0;
        if(pi===4&&w===4){cnt.goles=2;cnt.remates=Math.max(cnt.remates,3);} if(pi===3&&w===4) cnt.asistencias=1; if(pi===1&&w===2){cnt.goles=Math.max(cnt.goles,1);cnt.remates=Math.max(cnt.remates,1);} }
      const k=`${w}-${tipo}-${pi}`; regs[p.id]={asis:"P",ind,cnt,nota:notes[k]!==undefined?SAMPLE_NOTES[notes[k]][L]:""};
    });
    const gf=tipo==="P"?Object.values(regs).reduce((s,r)=>s+(r.cnt?.goles||0),0):null;
    putRow("actividades",{id:uuid(),categoria_id:c.id,tipo,fecha:`2026-10-${String(1+(w-1)*7+(tipo==="P"?1:0)).padStart(2,"0")}`,semana:w,
      tema:tipo==="E"?temas[w-1][L]:"",rival:tipo==="P"?rivals[w-1]:"",goles_favor:gf,goles_contra:tipo==="P"?[2,1,3,2][w-1]:null,registros:regs,borrado:false});
  }
  ST.cat=c.id; persist(); draft=null; renderAll(); toast(t("sampleLoaded"));
}
function importJSON(d){
  if(d.app==="AU-Registro" && d.data){
    TABLES.forEach(tb=>Object.values(d.data[tb]||{}).forEach(r=>{ const row={...r}; delete row.owner; putRow(tb,row); }));
    return;
  }
  if(Array.isArray(d.players)&&Array.isArray(d.sessions)){   // Registro U6 (versión anterior)
    const c=createCategory(d.cfg?.equipo||"U6",d.cfg?.club||"","formativo");
    c.semanas=+d.cfg?.semanas||8; c.inicio_ciclo=d.cfg?.inicioCiclo||today(); putRow("categorias",c);
    const map={}, pmap={Der:"R",Izq:"L",Ambos:"B","?":""};
    d.players.forEach(p=>{ const id=uuid(); map[p.id]=id; putRow("jugadores",{id,categoria_id:c.id,nombre:p.nombre||"",edad:+p.edad||null,pie:pmap[p.pie]??p.pie??"",borrado:false}); });
    d.sessions.forEach(s=>{ const regs={}; for(const k in s.regs||{}){ if(map[k]) regs[map[k]]=s.regs[k]; }
      putRow("actividades",{id:uuid(),categoria_id:c.id,tipo:s.tipo==="P"?"P":"E",fecha:s.fecha,semana:s.semana,tema:s.tema||"",rival:s.rival||"",registros:regs,borrado:false}); });
    ST.cat=c.id; return;
  }
  throw new Error("bad");
}

$("#bCatNew").addEventListener("click",()=>{
  const n=$("#nNombre").value.trim(); if(!n){ toast(t("needName")); return; }
  createCategory(n,$("#nClub").value.trim(),$("#nEtapa").value); $("#nNombre").value=""; draft=null; curTab="plantel"; renderAll(); toast(t("catCreated"));
});
$("#bSyncNow").addEventListener("click",()=>{ syncErr=null; sync(); });
$("#bRefresh0").addEventListener("click",()=>{ syncErr=null; sync(); });
$("#bBit").addEventListener("click",loadBit);
$("#bSample").addEventListener("click",e=>{ const b=e.currentTarget; if(!b.dataset.confirm){ b.dataset.confirm="1"; b.textContent=t("confirmAgain"); setTimeout(()=>{ if(b.dataset.confirm){ delete b.dataset.confirm; b.textContent=t("loadSample"); } },3000); return; } delete b.dataset.confirm; b.textContent=t("loadSample"); loadSample(); });
$("#bExport").addEventListener("click",()=>{ logEvent("exportar"); const data={}; TABLES.forEach(tb=>data[tb]=ST.data[tb]); downloadBlob(new Blob([JSON.stringify({app:"AU-Registro",version:1,exportado:new Date().toISOString(),data},null,2)],{type:"application/json"}),`au-registro-${today()}.json`); });
$("#bImport").addEventListener("click",()=>$("#fileIn").click());
$("#fileIn").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ importJSON(JSON.parse(rd.result)); logEvent("importar",f.name); draft=null; renderAll(); toast(t("imported")); }catch(err){ toast(t("badFile")); } }; rd.readAsText(f); e.target.value=""; });
$("#bLogout").addEventListener("click",e=>{
  const b=e.currentTarget;
  if(pendingCount()&&!b.dataset.confirm){ b.dataset.confirm="1"; toast(t("logoutPend")); setTimeout(()=>delete b.dataset.confirm,4000); return; }
  const tok=ST.session?.access_token;
  if(tok&&navigator.onLine) fetch(CONFIG.supabaseUrl+"/auth/v1/logout",{method:"POST",headers:{apikey:CONFIG.supabaseKey,Authorization:"Bearer "+tok}}).catch(()=>{});
  ST=emptyStore(); persist(); draft=null; curTab="reg"; renderAll(); showLogin(false);
});

window.addEventListener("online",()=>{ renderPill(); sync(); });
window.addEventListener("offline",renderPill);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") sync(); });
setInterval(()=>{ if(document.visibilityState==="visible"&&pendingCount()) sync(); },60000);

/* ---------- Modo sin conexión cuando está publicada en la web (sw.js) ---------- */
if("serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }

/* ---------- Arranque ---------- */
async function fromEmailLink(){
  const h=new URLSearchParams(location.hash.replace(/^#/,""));
  if(!h.get("access_token")&&!h.get("error_description")) return false;
  history.replaceState(null,"",location.pathname+location.search);
  if(h.get("error_description")){ showLogin(false); $("#lMsg").textContent=h.get("error_description").replace(/\+/g," "); $("#lMsg").className="msg err"; return true; }
  try{
    const r=await fetch(CONFIG.supabaseUrl+"/auth/v1/user",{headers:{apikey:CONFIG.supabaseKey,Authorization:"Bearer "+h.get("access_token")}});
    const user=await r.json(); if(!r.ok) throw new Error(user.msg||r.status);
    await finishLogin({access_token:h.get("access_token"),refresh_token:h.get("refresh_token"),expires_at:+h.get("expires_at")||undefined,expires_in:+h.get("expires_in")||3600,user});
  }catch(e){ showLogin(false); }
  return true;
}
renderAll();
fromEmailLink().then(done=>{ if(done) return; if(!ST.session) showLogin(false); else sync(); });
</script>
</body>
